name: Linux release-candidate package E2E (no publish)

on:
  pull_request:
    paths:
      - ".github/workflows/linux-candidate-package-e2e.yml"
      - ".github/workflows/release.yml"
      - "scripts/install-smoke.mjs"
      - "scripts/lib/installSmoke.mjs"
      - "scripts/lib/installSmoke.test.mjs"
      - "scripts/release-asset-integrity.mjs"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/src/m3_production.rs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: linux-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-x64-package:
    # This job builds a candidate from the checked-out commit only.
    # It NEVER touches GitHub Releases or updater channels.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Host prerequisites for real Tauri package build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential xdg-utils unzip cmake \
            clang libclang-dev ninja-build

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: candidate-linux-x64

      - name: Install exact project dependencies
        run: pnpm install --frozen-lockfile

      - name: Check runtime manifest and installer smoke contracts
        run: |
          pnpm test:manifest
          pnpm test:managed-runtime
          pnpm test:install-smoke

      - name: Stage exact verified runtimes and CLI
        run: |
          pnpm stage:whisper
          pnpm stage:sherpa-runtime
          pnpm stage:wake-word
          pnpm stage:cli
          pnpm stage:runtime
          pnpm stage:runtime:tts
          pnpm stage:runtime:sd
        env:
          MANAGED_RUNTIME_TARGET: x86_64-unknown-linux-gnu
          CLI_SIDECAR_TARGET: x86_64-unknown-linux-gnu

      - name: Build real Debian installer (never upload to a release)
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb

      - name: Collect installer and verified package manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts evidence
          bundle=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb
          find "$bundle" -maxdepth 1 -name '*.deb' -type f -exec cp '{}' artifacts/ ';'
          mapfile -t files < <(find artifacts -maxdepth 1 -name '*.deb' -type f)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one candidate .deb; found ${#files[@]}" >&2
            exit 1
          fi
          sha256sum "${files[0]}" | tee evidence/sha256.txt
          dpkg-deb --info "${files[0]}" > evidence/deb-control.txt
          dpkg-deb --contents "${files[0]}" > evidence/deb-file-manifest.txt
          git rev-parse HEAD > evidence/source-commit.txt

      - name: Extract and execute the candidate's real CLI
        shell: bash
        run: node scripts/install-smoke.mjs --artifacts artifacts --require-clean

      - name: Install candidate through apt package manager in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          package="$(find artifacts -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$package"
          sudo apt-get install -y "./$package"
          package_name="$(dpkg-deb -f "$package" Package)"
          dpkg-query -W "$package_name" | tee evidence/installed-package.txt
          dpkg --verify "$package_name" > evidence/dpkg-verify.txt
          if [ -s evidence/dpkg-verify.txt ]; then
            echo "Installed Debian package verification reported differences" >&2
            cat evidence/dpkg-verify.txt
            exit 1
          fi
          echo "PASS: apt installed the actual candidate package on Ubuntu runner" | tee evidence/install-result.txt

      - name: Preserve exact candidate evidence, even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-candidate-e2e
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

      # The .deb is intentionally NOT attached to a public release.
      # This hosted-runner test does NOT prove a graphical first-run, an
      # upgrade from a different version, a rollback, or non-Linux hosts.
