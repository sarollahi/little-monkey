name: Linux release-candidate package E2E (no publish)

on:
  pull_request:
    paths:
      - ".github/workflows/linux-candidate-package-e2e.yml"
      - ".github/workflows/release.yml"
      - "scripts/install-smoke.mjs"
      - "scripts/lib/installSmoke.mjs"
      - "scripts/lib/installSmoke.test.mjs"
      - "scripts/release-asset-integrity.mjs"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/src/m3_production.rs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: linux-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-x64-package:
    # This job builds a candidate from the checked-out commit only.
    # It NEVER touches GitHub Releases or updater channels.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim space for actual candidate plus previous installer
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Host prerequisites for real Tauri package build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential xdg-utils unzip cmake \
            clang libclang-dev ninja-build

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: candidate-linux-x64

      - name: Install exact project dependencies
        run: pnpm install --frozen-lockfile

      - name: Check runtime manifest and installer smoke contracts
        run: |
          pnpm test:manifest
          pnpm test:managed-runtime
          pnpm test:install-smoke

      - name: Set a never-published test candidate version above the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --test scripts/ci-candidate-version.test.mjs
          latest="$(gh release view --json tagName --jq .tagName)"
          test -n "$latest"
          node scripts/ci-candidate-version.mjs --latest-published "$latest" \
            | tee evidence/ephemeral-candidate-version.json
          # The CLI, bundle and package must agree on this ephemeral version.
          pnpm test:manifest
          git diff -- src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json package.json \
            > evidence/ephemeral-version.patch
          echo "Only the isolated CI checkout is mutated. Never tag or publish this candidate."

      - name: Stage exact verified runtimes and CLI
        run: |
          pnpm stage:whisper
          pnpm stage:sherpa-runtime
          pnpm stage:wake-word
          pnpm stage:cli
          pnpm stage:runtime
          pnpm stage:runtime:tts
          pnpm stage:runtime:sd
        env:
          MANAGED_RUNTIME_TARGET: x86_64-unknown-linux-gnu
          CLI_SIDECAR_TARGET: x86_64-unknown-linux-gnu

      - name: Build real Debian installer (never upload to a release)
        # A candidate must not require production updater private keys.
        # Disable updater artifacts only for this CI build, not product config.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            2>&1 | tee evidence/candidate-build.log

      - name: Collect installer and verified package manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts evidence
          bundle=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb
          find "$bundle" -maxdepth 1 -name '*.deb' -type f -exec cp '{}' artifacts/ ';'
          mapfile -t files < <(find artifacts -maxdepth 1 -name '*.deb' -type f)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one candidate .deb; found ${#files[@]}" >&2
            exit 1
          fi
          sha256sum "${files[0]}" | tee evidence/sha256.txt
          dpkg-deb --info "${files[0]}" > evidence/deb-control.txt
          dpkg-deb --contents "${files[0]}" > evidence/deb-file-manifest.txt
          git rev-parse HEAD > evidence/source-commit.txt

      - name: Extract and execute the candidate's real CLI
        shell: bash
        run: node scripts/install-smoke.mjs --artifacts artifacts --require-clean

      - name: Download and verify the latest published older x64 Debian package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release list --limit 40 --json tagName,isDraft,isPrerelease > evidence/release-list.json
          PREVIOUS_VERSION="$(node -e '
            const fs=require("node:fs");
            const current=process.argv[1].split(".").map(Number);
            const compare=(a,b)=>{for(let i=0;i<3;i++){if(a[i]!==b[i])return a[i]-b[i]}return 0};
            const releases=JSON.parse(fs.readFileSync("evidence/release-list.json","utf8"));
            const viable=releases.filter(x=>!x.isDraft&&!x.isPrerelease&&/^\d+\.\d+\.\d+$/.test(x.tagName))
              .filter(x=>compare(x.tagName.split(".").map(Number),current)<0)
              .sort((a,b)=>compare(b.tagName.split(".").map(Number),a.tagName.split(".").map(Number)));
            process.stdout.write(viable[0]?.tagName||"");
          ' "$current")"
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "Cannot demonstrate a real cross-version upgrade: no older published release" >&2
            exit 1
          fi
          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
          mkdir -p previous
          gh release download "$PREVIOUS_VERSION" --dir previous --pattern '*amd64.deb'
          gh release download "$PREVIOUS_VERSION" --dir previous --pattern '*amd64.deb.asc'
          gh release download "$PREVIOUS_VERSION" --dir previous --pattern 'little-monkey-release-key.asc'
          gh api "repos/${{ github.repository }}/releases/tags/$PREVIOUS_VERSION" > evidence/previous-release-metadata.json
          node scripts/release-asset-integrity.mjs \
            --metadata evidence/previous-release-metadata.json \
            --artifacts previous | tee evidence/previous-digest-check.txt

          # Verify actual release detached GPG signature, not just presence of
          # a .asc filename. The key is downloaded alongside the release, so
          # this authenticates INTERNAL release consistency, NOT an independently
          # pinned publisher identity. The latter remains manual acceptance.
          previous_deb="$(find previous -maxdepth 1 -name '*amd64.deb' -type f -print -quit)"
          test -n "$previous_deb"
          test -f "$previous_deb.asc"
          test -s previous/little-monkey-release-key.asc
          keyring="$RUNNER_TEMP/previous-release-public-keys"
          mkdir -m 700 "$keyring"
          gpg --batch --homedir "$keyring" --import previous/little-monkey-release-key.asc \
            > evidence/previous-gpg-import.txt 2>&1
          gpg --batch --homedir "$keyring" --with-colons --fingerprint \
            > evidence/previous-gpg-fingerprint.txt
          actual_fingerprint="$(awk -F: '$1=="fpr" {print $10; exit}' evidence/previous-gpg-fingerprint.txt)"
          expected_fingerprint="$(node -p "require('./scripts/release-trust-pins.json').linux_gpg_fingerprint")"
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::Previous release's GPG key differs from pinned publisher-continuity fingerprint"
            exit 1
          fi
          gpg --batch --homedir "$keyring" --verify "$previous_deb.asc" "$previous_deb" \
            > evidence/previous-gpg-verify.txt 2>&1
          grep -E 'Good signature|gpg: Signature made' evidence/previous-gpg-verify.txt
          echo "VERIFIED: detached GPG signature matches pinned v1.12.0 release key; independent publisher identity NOT VERIFIED" \
            > evidence/previous-gpg-verdict.txt

      - name: Actually install previous published version through apt
        shell: bash
        run: |
          set -euo pipefail
          file="$(find previous -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$file"
          echo "Previous package: $file" | tee evidence/previous-package.txt
          sudo apt-get install -y "./$file"
          package_name="$(dpkg-deb -f "$file" Package)"
          expected="$(dpkg-deb -f "$file" Version)"
          actual="$(dpkg-query -W -f='${Version}' "$package_name")"
          test "$actual" = "$expected"
          printf '%s\n' "$package_name" > evidence/package-name.txt
          echo "$actual" > evidence/previous-installed-version.txt
          # Execute the actual system-installed binary at every package stage.
          cli="/usr/bin/monkey-cli"
          test -x "$cli"
          "$cli" --version | tee evidence/previous-cli-version.txt
          core="$(printf '%s' "$expected" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')"
          test -n "$core"
          grep -Fq "$core" evidence/previous-cli-version.txt
          mkdir -p "$RUNNER_TEMP/lm-user-data/com.littlemonkey.app"
          # Synthetic canary: package-manager data retention ONLY. This is
          # not proof that live user session databases migrated successfully.
          printf 'acceptance-canary-%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/lm-user-data/com.littlemonkey.app/canary.txt"
          sha256sum "$RUNNER_TEMP/lm-user-data/com.littlemonkey.app/canary.txt" > evidence/data-canary-before.txt

      - name: Actually upgrade to candidate and verify installed version and canary
        shell: bash
        run: |
          set -euo pipefail
          file="$(find artifacts -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$file"
          sudo apt-get install -y "./$file"
          package_name="$(cat evidence/package-name.txt)"
          expected="$(dpkg-deb -f "$file" Version)"
          actual="$(dpkg-query -W -f='${Version}' "$package_name")"
          test "$actual" = "$expected"
          echo "$actual" > evidence/candidate-installed-version.txt
          # Execute the actual system-installed binary at every package stage.
          cli="/usr/bin/monkey-cli"
          test -x "$cli"
          "$cli" --version | tee evidence/candidate-cli-version.txt
          core="$(printf '%s' "$expected" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')"
          test -n "$core"
          grep -Fq "$core" evidence/candidate-cli-version.txt
          (cd "$RUNNER_TEMP/lm-user-data/com.littlemonkey.app" && sha256sum -c "$GITHUB_WORKSPACE/evidence/data-canary-before.txt") 2>&1 | tee evidence/upgrade-canary-check.txt
          # sha256sum -c uses the original absolute pathname recorded before
          # the upgrade; it checks unchanged bytes, not app DB migration.
          dpkg --verify "$package_name" > evidence/dpkg-verify.txt
          test ! -s evidence/dpkg-verify.txt

      - name: Roll back the package with apt and verify exact older version
        shell: bash
        run: |
          set -euo pipefail
          file="$(find previous -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$file"
          sudo apt-get install -y --allow-downgrades "./$file"
          package_name="$(cat evidence/package-name.txt)"
          expected="$(dpkg-deb -f "$file" Version)"
          actual="$(dpkg-query -W -f='${Version}' "$package_name")"
          test "$actual" = "$expected"
          echo "$actual" > evidence/rolled-back-package-version.txt
          # Execute the actual system-installed binary at every package stage.
          cli="/usr/bin/monkey-cli"
          test -x "$cli"
          "$cli" --version | tee evidence/rollback-cli-version.txt
          core="$(printf '%s' "$expected" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')"
          test -n "$core"
          grep -Fq "$core" evidence/rollback-cli-version.txt
          dpkg --verify "$package_name" > evidence/dpkg-verify-after-rollback.txt
          test ! -s evidence/dpkg-verify-after-rollback.txt
          sha256sum -c evidence/data-canary-before.txt | tee evidence/rollback-canary-check.txt
          echo "PASS: real apt install, cross-version upgrade and apt downgrade; GUI and in-app updater rollback remain UNVERIFIED" | tee evidence/install-result.txt

      - name: Preserve exact candidate evidence, even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-candidate-e2e
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

      # The .deb is intentionally NOT attached to a public release.
      # This hosted-runner test proves a Debian package-manager install,
      # version upgrade and apt downgrade only if all commands pass.
      # It does NOT prove the signed in-app updater's rollback script,
      # application DB migration, real GUI first run or other OSes.
