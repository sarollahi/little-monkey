name: RustSec compatible-fix preview (no repository writes)

on:
  pull_request:
    paths:
      - ".github/workflows/security-fix-preview.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rustsec-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: rustsec-preview-only

      - name: Preview known semver-compatible vulnerability patches
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-preview
          : > security-preview/updates.log
          attempt() {
            local label="$1"
            shift
            printf '## %s\\n' "$label" >> security-preview/updates.log
            if "$@" >> security-preview/updates.log 2>&1; then
              echo "PASS $label" >> security-preview/updates.log
            else
              echo "NOT_RESOLVED $label" >> security-preview/updates.log
            fi
          }
          attempt "quinn-proto 0.11.19" cargo update --manifest-path src-tauri/Cargo.toml -p quinn-proto --precise 0.11.19
          attempt "quinn-udp 0.5.16" cargo update --manifest-path src-tauri/Cargo.toml -p quinn-udp --precise 0.5.16
          attempt "vodozemac 0.11.2" cargo update --manifest-path src-tauri/Cargo.toml -p vodozemac --precise 0.11.2

          # Wasmtime / WASI are exact-pinned together. Never change just one
          # to an ABI-incompatible version without testing both.
          cp src-tauri/Cargo.toml security-preview/original-Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/Cargo.toml')
          text = p.read_text()
          if text.count('version = "=48.0.7"') == 2:
              p.write_text(text.replace('version = "=48.0.7"', 'version = "=48.0.8"'))
          elif text.count('version = "=48.0.8"') == 2:
              print('Wasmtime/WASI already updated to compatible patched version')
          else:
              raise SystemExit('Unexpected Wasmtime/WASI pins: refuse speculative update')
          PY
          attempt "wasmtime 48.0.8" cargo update --manifest-path src-tauri/Cargo.toml -p wasmtime --precise 48.0.8
          attempt "wasmtime-wasi 48.0.8" cargo update --manifest-path src-tauri/Cargo.toml -p wasmtime-wasi --precise 48.0.8

          if cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps \
            > security-preview/cargo-metadata.json 2>security-preview/metadata.stderr; then
            echo "VALID_LOCKFILE_METADATA" > security-preview/resolution-status.txt
          else
            echo "FAILED_LOCKFILE_METADATA" > security-preview/resolution-status.txt
          fi
          git diff -- src-tauri/Cargo.toml src-tauri/Cargo.lock > security-preview/security-preview.patch
          git diff --check -- src-tauri/Cargo.toml src-tauri/Cargo.lock \
            > security-preview/patch-whitespace.txt || true
          echo "Preview only: no commit, no ignored security advisories and no claim of passing Rust tests" \
            | tee security-preview/verification-limit.txt

      - name: Check remaining RustSec findings on preview lockfile
        if: always()
        shell: bash
        run: |
          set +e
          cargo install cargo-audit --locked > security-preview/audit-install.log 2>&1
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo audit --file src-tauri/Cargo.lock --json > security-preview/audit.json 2>security-preview/audit.stderr
            echo "$?" > security-preview/audit-exit-code.txt
          else
            echo "NOT_RUN: cargo-audit installation failed" > security-preview/audit-exit-code.txt
          fi

      - name: Upload exact non-publishing patch and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustsec-compatible-preview
          path: security-preview/
          if-no-files-found: error
          retention-days: 7
